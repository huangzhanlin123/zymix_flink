# 本地运行用的变量模板。复制成 local/<名字>.properties 再改（除本文件外 local/ 不入库）：
#   cp local/example.properties local/ods.properties
# 运行：
#   mvn -Plocal -q compile exec:exec -Drun.args="--props local/ods.properties --dry-run"
#
# 托管 Flink 上这些键配在应用的 Runtime properties 里（任意分组，运行器会合并）。

# 要跑的脚本（sql/ 下的文件名）：
#   telemetry_kafka_to_zymix_ods.sql  埋点 → zymix_ods.app_events
SQL_FILE=telemetry_kafka_to_zymix_ods.sql

# ---- Kafka ----
# 生产：MSK Serverless，boot-syluwxnk.c3.kafka-serverless.eu-central-1.amazonaws.com:9098，只支持 IAM
KAFKA_BROKERS=localhost:9092
# MSK 用 IAM 认证时设 true，运行器会给 Kafka 表补 SASL/AWS_MSK_IAM 选项
KAFKA_IAM=false
TELEMETRY_EVENT_TOPIC=telemetry.events

# ---- Doris / VeloDB ----
DORIS_FENODES=127.0.0.1:8080
# DORIS_BENODES 可不填
DORIS_USER=root
DORIS_PASSWORD=
# 或者从 Secrets Manager 读账号（JSON: {"username": "...", "password": "..."}），会覆盖上面两项
# DORIS_SECRET_ID=

# ---- telemetry_kafka_to_zymix_ods.sql ----
# 不能和生产作业的消费组相同
ZYMIX_ODS_GROUP_ID=zymix-ods-telemetry-local
# 不填默认 group-offsets（消费组没有位点时从 earliest 开始）
# ZYMIX_ODS_STARTUP_MODE=latest-offset
# 每次不从快照恢复的重新提交都要换，否则 Doris label 冲突，作业反复重启
ZYMIX_ODS_LABEL_PREFIX=zymix_ods_telemetry_local_20261121

# ---- 跨账号（可选）----
# AWS_DATA_ROLE_ARN=arn:aws:iam::<account>:role/<role>
# AWS_REGION=eu-central-1
