# 本地运行用的变量模板。复制成 local/<名字>.properties 再改（除本文件外 local/ 不入库）：
#   cp local/example.properties local/ods.properties
# 运行：
#   mvn -Plocal -q compile exec:java -Dexec.args="--props local/ods.properties --dry-run"
#
# 托管 Flink 上这些键配在应用的 Runtime properties 里（任意分组，运行器会合并）。

SQL_FILE=kafka_to_ods.sql

# ---- Kafka ----
KAFKA_BROKERS=localhost:9092
# MSK 用 IAM 认证时设 true，运行器会给 Kafka 表补 SASL/AWS_MSK_IAM 选项
KAFKA_IAM=false
TELEMETRY_EVENT_TOPIC=telemetry-events
TELEMETRY_ODS_GROUP_ID=telemetry-ods-local
# earliest-offset / latest-offset / group-offsets
TELEMETRY_ODS_STARTUP_MODE=latest-offset

# ---- Doris / VeloDB ----
DORIS_FENODES=127.0.0.1:8030
# DORIS_BENODES 可不填
DORIS_USER=root
DORIS_PASSWORD=
# 或者从 Secrets Manager 读账号（JSON: {"username": "...", "password": "..."}），会覆盖上面两项
# DORIS_SECRET_ID=
# 每次提交必须唯一，否则 Doris label 冲突，作业反复重启
TELEMETRY_ODS_LABEL_PREFIX=telemetry_ods_local_20261121
# VeloDB（存算分离）对 MoW 表不支持 2PC，必须 false
TELEMETRY_ODS_ENABLE_2PC=false

# ---- 跨账号（可选）----
# AWS_DATA_ROLE_ARN=arn:aws:iam::<account>:role/<role>
# AWS_REGION=eu-central-1
